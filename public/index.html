<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadBoard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 id="app-name">LeadBoard</h1>
      <span class="version" id="app-version"></span>
    </div>
  </header>

  <main class="container">
    <section class="counters" id="counters" aria-label="Resumen por estado"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Leads</h2>
        <div class="filters" id="filters" role="group" aria-label="Filtrar por estado"></div>
      </div>
      <p class="message" id="message" hidden></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Empresa</th>
              <th>Contacto</th>
              <th>Estado</th>
              <th>Creado</th>
            </tr>
          </thead>
          <tbody id="leads-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="container footer">Datos de demostración generados de forma sintética.</footer>

  <script src="/app.js"></script>
</body>
</html>
